<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobHQ — AI Job Intelligence Platform</title>
  <style>
    body {
      background-color: #090a0f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #fff; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    a:hover { background: #4338ca; }
  </style>
  <script>
    // Auto redirect to client dev server if running locally
    if (window.location.port === "3000") {
      fetch("/client/dist/index.html").catch(() => {
        // Dev mode fallback
      });
    }
  </script>
</head>
<body>
  <div class="card">
    <h1>JobHQ Platform</h1>
    <p>Please build the client bundle with <code>npm run build</code> or launch the live Vite React interface on port 5173.</p>
    <a href="http://localhost:5173">Open Vite Dev App (Port 5173)</a>
  </div>
</body>
</html>
