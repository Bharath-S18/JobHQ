<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>JobHQ — Autonomous AI Job Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,900,700,500,300,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-mode">
  <div class="ra-ambient-background">
    <div class="ra-glow top-center"></div>
    <div class="ra-glow bottom-right"></div>
    <div class="ra-grid-pattern"></div>
  </div>
  <div class="app-shell">
    <!-- Left Navigation Rail (Desktop & Tablet) -->
    <nav class="rail" aria-label="Primary navigation">
      <div class="rail-top">
        <div class="rail-brand" title="JobHQ Command Center" data-view="jobs">
          <span class="material-symbols-outlined rail-brand-icon">hub</span>
        </div>
        <div class="rail-nav">
          <button class="rail-btn active" data-view="jobs" title="Jobs Dashboard" aria-label="Jobs Dashboard">
            <span class="material-symbols-outlined">work</span>
            <span class="rail-tooltip">Jobs</span>
          </button>
          <button class="rail-btn" data-view="hunter" title="Autonomous LinkedIn Hunter" aria-label="LinkedIn Hunter">
            <span class="material-symbols-outlined">explore</span>
            <span class="rail-tooltip">LinkedIn Hunter</span>
          </button>
          <button class="rail-btn" data-view="gmail" title="Gmail &amp; Superset Alerts" aria-label="Gmail &amp; Superset Alerts">
            <span class="material-symbols-outlined">mail</span>
            <span class="rail-tooltip">Gmail Alerts</span>
          </button>
          <button class="rail-btn" data-view="applications" title="Applications Pipeline" aria-label="Applications Pipeline">
            <span class="material-symbols-outlined">assignment</span>
            <span class="rail-tooltip">Applications</span>
          </button>
          <button class="rail-btn" data-view="studio" title="Resume Studio / Tailored Documents" aria-label="Resume Studio">
            <span class="material-symbols-outlined">auto_awesome_motion</span>
            <span class="rail-tooltip">Resume Studio</span>
          </button>
          <button class="rail-btn" data-view="profile" title="Profile &amp; Master System" aria-label="Profile &amp; Master System">
            <span class="material-symbols-outlined">badge</span>
            <span class="rail-tooltip">Profile &amp; Documents</span>
          </button>
          <button class="rail-btn" data-view="settings" title="Workspace Settings" aria-label="Workspace Settings">
            <span class="material-symbols-outlined">settings</span>
            <span class="rail-tooltip">Settings</span>
          </button>
        </div>
      </div>

      <div class="rail-bottom">
        <div class="rail-user-avatar-wrap" data-action="toggle-user-menu" title="Account Menu">
          <div class="user-avatar-rail" id="user-avatar-rail">--</div>
        </div>
      </div>
    </nav>

    <!-- Workspace View Container -->
    <div class="workspace">
      <!-- High-Tech Command Bar Header -->
      <header class="app-bar">
        <div class="app-bar-left">
          <div class="brand-group">
            <span class="brand-badge">PRO</span>
            <h1 id="page-title" class="page-header-title">Command Center</h1>
          </div>

          <!-- Header Global Quick Search -->
          <div class="header-search-wrap" id="header-search-wrap">
            <span class="material-symbols-outlined header-search-icon">search</span>
            <input
              type="text"
              id="header-search-input"
              class="header-search-input"
              placeholder="Search roles, companies, tech stack..."
              autocomplete="off"
            />
            <kbd class="search-kbd">⌘K</kbd>
          </div>
        </div>

        <div class="app-bar-actions">
          <!-- Active AI Model Status Pill -->
          <div class="model-pill" id="model-chip" title="Active AI Tailoring Model">
            <span class="material-symbols-outlined model-icon">memory</span>
            <span class="model-text" id="model-text">Local Model</span>
          </div>

          <!-- Quick Action: Scan Jobs -->
          <button class="btn btn-scan" id="scan-btn" data-action="scan" title="Scan Gmail for new LinkedIn alert emails">
            <span class="material-symbols-outlined scan-icon">sync</span>
            <span>Scan Jobs</span>
          </button>

          <!-- Standard User Profile Widget & Dropdown -->
          <div class="user-menu-wrap" id="user-menu-wrap">
            <button class="user-menu-btn" id="user-menu-btn" data-action="toggle-user-menu" title="Account Menu" aria-expanded="false">
              <div class="user-avatar-sm" id="user-avatar-sm">--</div>
              <span class="material-symbols-outlined dropdown-arrow">expand_more</span>
            </button>

            <div class="user-dropdown hidden" id="user-dropdown" role="menu">
              <div class="user-dropdown-header">
                <div class="user-avatar-md" id="user-avatar-md">--</div>
                <div class="user-info">
                  <div class="user-name" id="user-display-name">Workspace Account</div>
                  <div class="user-email" id="user-display-email">Connecting...</div>
                </div>
              </div>

              <div class="user-dropdown-badge">
                <span class="material-symbols-outlined badge-icon">verified_user</span>
                <span>Verified Google SSO</span>
              </div>

              <div class="user-dropdown-divider"></div>

              <button class="dropdown-item" data-view="jobs" role="menuitem">
                <span class="material-symbols-outlined">work</span>
                <span>Jobs Dashboard</span>
              </button>

              <button class="dropdown-item" data-view="applications" role="menuitem">
                <span class="material-symbols-outlined">assignment</span>
                <span>Applications Pipeline</span>
              </button>

              <button class="dropdown-item" data-view="studio" role="menuitem">
                <span class="material-symbols-outlined">auto_awesome_motion</span>
                <span>Resume Studio</span>
              </button>

              <button class="dropdown-item" data-view="profile" role="menuitem">
                <span class="material-symbols-outlined">badge</span>
                <span>Profile &amp; Master System</span>
              </button>

              <button class="dropdown-item" data-view="analytics" role="menuitem">
                <span class="material-symbols-outlined">analytics</span>
                <span>Analytics &amp; Metrics</span>
              </button>

              <button class="dropdown-item" data-view="settings" role="menuitem">
                <span class="material-symbols-outlined">settings</span>
                <span>Workspace Settings</span>
              </button>

              <div class="user-dropdown-divider"></div>

              <button class="dropdown-item dropdown-item--danger" data-action="logout" role="menuitem">
                <span class="material-symbols-outlined">logout</span>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Application Dynamic Root -->
      <main id="app-root" class="content" aria-live="polite"></main>
    </div>
  </div>

  <!-- Job Modal / Tailoring Drawer -->
  <div id="job-modal" class="modal hidden" aria-hidden="true">
    <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button id="modal-close" class="drawer-close" data-action="close-modal" aria-label="Close panel">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
